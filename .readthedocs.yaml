# Read the Docs configuration, see https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: python/doc/source/conf.py

python:
  install:
    - requirements: python/requirements.readthedocs.txt
    # autodoc reads the docstrings of the compiled extension
    - method: pip
      path: python
